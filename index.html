<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Rozkazów Harcerskich</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Generator Rozkazów Harcerskich</h1>

  <div class="container">
    <!-- PANEL FORMULARZA -->
    <div class="form-box">
      <b>Dane nagłówka rozkazu</b>
      <label>Jednostka nadrzędna:</label>
      <input type="text" id="jednostkaNadrzedna" placeholder="np. Hufiec ZHP">

      <label>Jednostka:</label>
      <input type="text" id="jednostka" placeholder="np. 1 PDH Łaziki">

      <label>Data:</label>
      <input type="text" id="data" placeholder="np. Gniew, dnia 6 września 2026 r.">

      <label>Numer rozkazu:</label>
      <input type="text" id="nrRozkazu" placeholder="np. L. 1/2026">

      <label>Podpis komendanta/drużynowego:</label>
      <input type="text" id="podpis" placeholder="pwd. Jan Kowalski">

      <div class="section-group">
        <b>Dodaj punkt do rozkazu</b>
        <label>Typ wpisu:</label>
        <select id="actionType" onchange="zmienFormularz()">
          <option value="mianowanie">Mianowanie</option>
          <option value="zwolnienie">Zwolnienie</option>
          <option value="otwarcieProby">Otwarcie próby</option>
          <option value="zamkniecieProby">Zamknięcie próby</option>
          <option value="inny">Inny wpis / Kategoria</option>
        </select>

        <!-- Formularz Mianowanie -->
        <div id="formMianowanie" class="form-subgroup">
          <label>Stopień (opcjonalnie przed imieniem):</label>
          <select id="mianowanieStopien" class="select-stopien"></select>

          <label>Imię i nazwisko:</label>
          <input type="text" id="mianowanieOsoba" placeholder="Jan Kowalski">

          <label>Funkcja:</label>
          <select id="mianowanieFunkcja" class="select-funkcja"></select>
          <input type="text" id="mianowanieFunkcjaInna" class="hidden" placeholder="Wpisz własną funkcję" style="margin-top:5px;">
        </div>

        <!-- Formularz Zwolnienie -->
        <div id="formZwolnienie" class="form-subgroup hidden">
          <label>Stopień:</label>
          <select id="zwolnienieStopien" class="select-stopien"></select>

          <label>Imię i nazwisko:</label>
          <input type="text" id="zwolnienieOsoba" placeholder="Jan Kowalski">

          <label>Funkcja:</label>
          <select id="zwolnienieFunkcja" class="select-funkcja"></select>
          <input type="text" id="zwolnienieFunkcjaInna" class="hidden" placeholder="Wpisz własną funkcję" style="margin-top:5px;">

          <label>Czy dodać podziękowanie za służbę?</label>
          <select id="zwolnienieDziekowanie">
            <option value="tak">Tak</option>
            <option value="nie">Nie</option>
          </select>
        </div>

        <!-- Formularz Otwarcie Próby -->
        <div id="formOtwarcieProby" class="form-subgroup hidden">
          <label>Aktualny stopień:</label>
          <select id="otwarcieStopienAktualny" class="select-stopien"></select>

          <label>Imię i nazwisko:</label>
          <input type="text" id="otwarcieOsoba" placeholder="Jan Kowalski">

          <label>Stopień na który otwiera próbę:</label>
          <select id="otwarcieStopienOtwierany" class="select-stopien-pelny"></select>

          <label>Opiekun próby (opcjonalnie):</label>
          <input type="text" id="otwarcieOpiekun" placeholder="pwd. Anna Nowak">
        </div>

        <!-- Formularz Zamknięcie Próby -->
        <div id="formZamkniecieProby" class="form-subgroup hidden">
          <label>Aktualny stopień:</label>
          <select id="zamkniecieStopienAktualny" class="select-stopien"></select>

          <label>Imię i nazwisko:</label>
          <input type="text" id="zamkniecieOsoba" placeholder="Jan Kowalski">

          <label>Stopień zamykany:</label>
          <select id="zamkniecieStopienZamykany" class="select-stopien-pelny"></select>

          <label>Wynik próby:</label>
          <select id="zamkniecieWynik">
            <option value="pozytywny">Pozytywny (Przyznaję stopień)</option>
            <option value="negatywny">Negatywny (Przerywam próbę)</option>
          </select>
        </div>

        <!-- Formularz Inny -->
        <div id="formInny" class="form-subgroup hidden">
          <label>Kategoria rozkazu:</label>
          <select id="innyKategoria">
            <option value="1">1. Wyjątki z rozkazów</option>
            <option value="2">2. Uchwały, zarządzenia, decyzje</option>
            <option value="3">3. Mianowania</option>
            <option value="4">4. Zwolnienia</option>
            <option value="5">5. Stopnie, sprawności, odznaki</option>
            <option value="6">6. Pochwały</option>
            <option value="7">7. Nagany</option>
          </select>

          <label>Treść wpisu:</label>
          <textarea id="innyTresc" rows="3" placeholder="Wpisz treść zarządzenia lub komunikatu..."></textarea>
        </div>

        <button type="button" onclick="dodajPunkt()" style="margin-top: 15px;">Dodaj punkt do rozkazu</button>
      </div>

      <div class="section-group">
        <b>Lista dodanych punktów (edycja)</b>
        <div id="listaWpisow" class="entry-list"></div>
      </div>

      <div class="section-group">
        <label>Zarządzanie stanem rozkazu:</label>
        <button type="button" onclick="zapiszDoPliku()">Zapisz stan do pliku</button>
        <label for="wczytajPlikInput" class="btn-file-label">Wczytaj stan z pliku</label>
        <input type="file" id="wczytajPlikInput" accept=".json" style="display:none" onchange="wczytajZPliku(event)">
      </div>

      <button type="button" onclick="window.print()" style="margin-top: 20px;">Drukuj / Zapisz jako PDF</button>
    </div>

    <!-- PANEL PODGLĄDU -->
    <div class="preview-box" id="podglad"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
